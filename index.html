<style>
*{box-sizing:border-box}

body{
    margin:0;
    min-height:100vh;

        radial-gradient(circle at 50% -10%,#35206b,#09090f 65%);

button{

}

button:disabled{
    opacity:.35;

}

.header{

.logo{

.icon-btn{

.fuse-button:hover{

}

.balance{
    padding:10px 14px;
    border-radius:11px;

    border:1px solid #393958;

/* DAILY LUCK WHEEL */

.daily-wheel-button{
    width:42px;
    height:42px;
    min-width:42px;
    padding:0;
    display:flex;
    align-items:center;
    justify-content:center;
    border:1px solid #8d5cff;
    background:
        linear-gradient(135deg,#25134f,#171722);
    color:#e5d8ff;
    font-size:21px;
    text-shadow:0 0 10px #9b5cff;
    box-shadow:0 0 12px #7047ff22;
}

.daily-wheel-button.ready{
    border-color:#b98cff;
    box-shadow:
        0 0 15px #7047ff55,
        0 0 30px #7047ff22;
}

.daily-wheel-button.used{
    border-color:#44445b;
    color:#888;
    text-shadow:none;
    box-shadow:none;
}

.daily-wheel-button .daily-wheel-time{
    display:block;
    margin-top:2px;
    font-size:9px;
    color:#888;
    font-weight:normal;
}

.daily-wheel-modal{
    position:fixed;
    z-index:1300;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    padding:15px;
    background:#000d;
    backdrop-filter:blur(8px);
}

.daily-wheel-modal.show{
    display:flex;
}

.daily-wheel-box{
    width:620px;
    max-width:100%;
    max-height:92vh;
    overflow-y:auto;
    padding:25px;
    border-radius:22px;
    text-align:center;
    background:
        radial-gradient(circle at 50% 0%,#35206b,#15121f 48%,#0b0b11);
    border:1px solid #7047ff;
    box-shadow:
        0 25px 100px #000,
        0 0 55px #7047ff33;
}

.daily-wheel-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:8px;
}

.daily-wheel-header h2{
    margin:0;
    text-shadow:0 0 15px #9b5cff;
}

.daily-wheel-subtitle{
    color:#999;
    font-size:12px;
    margin-bottom:15px;
}

.daily-wheel-area{
    position:relative;
    width:340px;
    height:340px;
    max-width:90vw;
    max-height:90vw;
    margin:15px auto 20px;
}

.daily-wheel-pointer{
    position:absolute;
    z-index:10;
    top:-16px;
    left:50%;
    transform:translateX(-50%);
    font-size:40px;
    color:#fff;
    text-shadow:0 0 12px #fff,0 0 25px #7047ff;
}

.daily-wheel-spinner{
    position:relative;
    width:100%;
    height:100%;
    border-radius:50%;
    border:8px solid #29293b;
    background:conic-gradient(
        #7047ff 0deg 45deg,
        #ff4d6d 45deg 90deg,
        #ffb347 90deg 135deg,
        #35d963 135deg 180deg,
        #4b8cff 180deg 225deg,
        #c45cff 225deg 270deg,
        #00c9d7 270deg 315deg,
        #ff7b00 315deg 360deg
    );
    box-shadow:
        0 0 30px #000,
        0 0 50px #7047ff44;
    transition:transform 5s cubic-bezier(.12,.78,.08,1);
}

.daily-wheel-label{
    position:absolute;
    top:50%;
    left:50%;
    width:100%;
    height:100%;
    transform:translate(-50%,-50%);
    pointer-events:none;
}

.daily-wheel-label span{
    position:absolute;
    left:50%;
    top:50%;
    width:95px;
    margin-left:-47.5px;
    margin-top:-9px;
    font-size:11px;
    font-weight:900;
    text-shadow:0 2px 5px #000;
}

.daily-wheel-label span:nth-child(1){transform:rotate(22.5deg) translateY(-128px);}
.daily-wheel-label span:nth-child(2){transform:rotate(67.5deg) translateY(-128px);}
.daily-wheel-label span:nth-child(3){transform:rotate(112.5deg) translateY(-128px);}
.daily-wheel-label span:nth-child(4){transform:rotate(157.5deg) translateY(-128px);}
.daily-wheel-label span:nth-child(5){transform:rotate(202.5deg) translateY(-128px);}
.daily-wheel-label span:nth-child(6){transform:rotate(247.5deg) translateY(-128px);}
.daily-wheel-label span:nth-child(7){transform:rotate(292.5deg) translateY(-128px);}
.daily-wheel-label span:nth-child(8){transform:rotate(337.5deg) translateY(-128px);}

.daily-wheel-center{
    position:absolute;
    z-index:8;
    top:50%;
    left:50%;
    width:65px;
    height:65px;
    transform:translate(-50%,-50%);
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    background:#11111b;
    border:3px solid #fff;
    box-shadow:0 0 20px #7047ff;
    font-size:25px;
}

.daily-wheel-result{
    min-height:28px;
    margin-bottom:10px;
    font-size:20px;
    font-weight:900;
}

.daily-wheel-result.win{
    color:#ffd86b;
    text-shadow:0 0 15px #ffb300;
}

.daily-wheel-spin{
    width:100%;
    padding:15px;
    font-size:17px;
}

.daily-wheel-next{
    margin-top:10px;
    color:#777;
    font-size:11px;
}

@media(max-width:700px){
    .daily-wheel-button{
        width:37px;
        height:37px;
        min-width:37px;
        font-size:18px;
    }
}

.promo{

h1{

.black-circle.show{
